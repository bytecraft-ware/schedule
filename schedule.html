<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание</title>
<style>
:root{--bg:#f2f5fb;--card:#fff;--tx:#141a2e;--mu:#7b839a;--bd:#e4e8f1;--ac:#f58a1f;--bl:#3b7be8;--seg:#dcdfe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1b2030;--tx:#e8ebf5;--mu:#8e96ad;--bd:#2a3047;--seg:#2a3047}}
:root[data-theme="dark"]{--bg:#12151f;--card:#1b2030;--tx:#e8ebf5;--mu:#8e96ad;--bd:#2a3047;--seg:#2a3047}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:28px}
button,select,input{font:inherit;color:inherit}
.btn{border:1.5px solid #b9d0f5;background:var(--card);color:var(--bl);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600}
.pri{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer}
.danger{background:#e5484d;color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}
.bar .sp{flex:1}
.nav{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mu);padding:4px 8px}
.title{font-size:20px;font-weight:600;min-width:150px}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:9px;cursor:pointer;color:var(--mu);font-weight:600}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px #0002}
.cal{background:var(--card);border-radius:12px;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));min-width:910px}
.dh{text-align:center;color:var(--mu);padding:12px 0;font-size:14px}
.cell{border-top:1px solid var(--bd);border-left:1px solid var(--bd);min-height:120px;padding:8px 4px;cursor:pointer}
.week .cell{min-height:420px}
.cell.out{background:color-mix(in srgb,var(--bg) 60%,var(--card));opacity:.7}
.dn{text-align:center;font-size:14px;margin-bottom:6px;color:var(--tx)}
.dn span{display:inline-block;min-width:28px;padding:3px 6px;border-radius:14px}
.today span{background:#141a2e;color:#fff;font-weight:700}
.chip{display:flex;justify-content:space-between;gap:6px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card));border-radius:7px;padding:6px 8px;margin-bottom:4px;font-size:14px;cursor:pointer;overflow:hidden}
.chip b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.done{opacity:.55}.chip.urg,.card.urg{box-shadow:inset 0 0 0 1.5px #e5484d}.ck{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:15px;margin:10px 0 0}.ck input{width:auto}
.card{display:block;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--card));border-radius:9px;padding:10px;margin-bottom:6px;cursor:pointer}
.card small{color:var(--mu);display:block;font-size:13px}.card strong{display:block;margin:3px 0;font-size:15px}
.card.done{opacity:.55}
dialog{border:0;border-radius:16px;padding:22px;width:min(420px,92vw);background:var(--card);color:var(--tx)}
dialog::backdrop{background:#0008}
dialog h2{margin:0 0 14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg)}
.row{display:flex;gap:10px}.row>*{flex:1}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.sub{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.empty{padding:30px;text-align:center;color:var(--mu)}
</style></head><body>
<div class="top"><h1>Расписание</h1><button class="pri" id="add">+ Добавить</button></div>
<div class="bar">
<button class="btn" id="today">Сегодня</button>
<button class="nav" id="prev">‹</button><button class="nav" id="next">›</button>
<div class="title" id="ttl"></div><div class="sp"></div>
<button class="btn" id="subs">⚙ <span id="sbl">Предметы</span></button>
<div class="seg" id="vseg"><button data-v="month" class="on">Месяц</button><button data-v="week">Неделя</button></div>
<div class="seg" id="tseg"><button data-t="lesson" class="on">Уроки</button><button data-t="hw">Дела</button></div>
<div class="seg" id="fseg"><button data-f="all" class="on">Все</button><button data-f="fav">⭐ Избранное</button><button data-f="urg">🔥 Срочные</button></div>
</div>
<div class="cal" id="cal"></div>

<dialog id="dlg"><form method="dialog" id="f" onsubmit="return false">
<h2 id="dh">Новая запись</h2>
<label>Тип</label><select id="type"><option value="lesson">Урок</option><option value="hw">Дело</option></select>
<label id="sl">Категория</label><select id="subj"></select>
<label>Тема / что сделать</label><input id="name" placeholder="Например: купить продукты">
<div class="row"><div><label>Дата</label><input type="date" id="date"></div><div><label>Время (необязательно)</label><input type="time" id="time" value="10:00"></div></div>
<div class="row"><div><label>Длительность, мин</label><input type="number" id="dur" min="0" step="5" placeholder="необязательно"></div>
<div id="repw"><label>Повторять еженедельно, раз</label><input type="number" id="rep" min="1" max="52" value="1"></div></div>
<label class="ck"><input type="checkbox" id="fav"> ⭐ В избранное</label><label class="ck"><input type="checkbox" id="urg"> 🔥 Срочное</label>
<div class="acts"><button class="danger" id="del" type="button">Удалить</button><button class="btn" id="dn" type="button">Выполнено</button><button class="btn" id="cx" type="button">Отмена</button><button class="pri" id="sv" type="button">Сохранить</button></div>
</form></dialog>

<dialog id="sdlg"><h2 id="sh">Категории</h2><div id="slist"></div>
<label id="sl2">Новая категория</label>
<div class="row"><input id="sn" placeholder="Название"><input type="color" id="sc" value="#8b5cf6" style="max-width:60px;padding:2px"></div>
<div class="acts"><button class="btn" id="sx">Закрыть</button><button class="pri" id="sa">Добавить</button></div></dialog>

<script>
const $=id=>document.getElementById(id);
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DN=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];
let S={subjects:[],items:[]};
try{const r=localStorage.getItem('sched');if(r)S=JSON.parse(r)}catch(e){}
S.subjects=S.subjects.filter(s=>!['s1','s2','s3','s4'].includes(s.id));
S.subjects.forEach(s=>{if(!s.kind)s.kind='task'});
if(!S.subjects.some(s=>s.kind==='lesson'))S.subjects.push({id:'l1',name:'Информатика',color:'#8b5cf6',kind:'lesson'},{id:'l2',name:'Қазақстан тарихы',color:'#ef4444',kind:'lesson'},{id:'l3',name:'Математика',color:'#3b82f6',kind:'lesson'});
const k=()=>tab==='lesson'?'lesson':'task';let armed=null;
const save=()=>{try{localStorage.setItem('sched',JSON.stringify(S))}catch(e){}};
let view='month',tab='lesson',fil='all',cur=new Date(),editId=null;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mon=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const uid=()=>Math.random().toString(36).slice(2,9);
const sub=id=>S.subjects.find(s=>s.id===id)||{name:'Без категории',color:'#8b93a8'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function items(ds){return S.items.filter(i=>i.date===ds&&i.type===tab&&(fil==='all'||(fil==='fav'&&i.fav)||(fil==='urg'&&i.urgent))).sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0)||(a.time||'').localeCompare(b.time||''))}
function render(){$('sbl').textContent=tab==='lesson'?'Предметы':'Категории';
 $('vseg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 $('tseg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('fseg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===fil));
 let start,n,m=cur.getMonth(),todayS=iso(new Date());
 if(view==='month'){const f=new Date(cur.getFullYear(),m,1);start=mon(f);const l=new Date(cur.getFullYear(),m+1,0);n=Math.ceil(((l-start)/864e5+1)/7)*7;$('ttl').textContent=MN[m]+' '+cur.getFullYear()}
 else{start=mon(cur);n=7;const e=new Date(start);e.setDate(e.getDate()+6);$('ttl').textContent=start.getDate()+' '+MN[start.getMonth()].slice(0,3).toLowerCase()+' – '+e.getDate()+' '+MN[e.getMonth()].slice(0,3).toLowerCase()+' '+e.getFullYear()}
 let h='<div class="grid '+(view==='week'?'week':'')+'">'+DN.map(d=>'<div class="dh">'+d+'</div>').join('');
 for(let i=0;i<n;i++){const d=new Date(start);d.setDate(d.getDate()+i);const ds=iso(d);
  const out=view==='month'&&d.getMonth()!==m;
  h+='<div class="cell'+(out?' out':'')+'" data-d="'+ds+'"><div class="dn'+(ds===todayS?' today':'')+'"><span>'+d.getDate()+'</span></div>';
  items(ds).forEach(it=>{const s=sub(it.subject);const chk=(it.done?'✓ ':'')+(it.fav?'⭐ ':'')+(it.urgent?'🔥 ':'');
   if(view==='month')h+='<div class="chip'+(it.done?' done':'')+(it.urgent?' urg':'')+'" data-i="'+it.id+'" style="--c:'+s.color+'" title="'+esc(it.name)+'"><b>'+esc(it.name||s.name)+'</b><span>'+chk+(it.time||'')+'</span></div>';
   else h+='<div class="card'+(it.done?' done':'')+(it.urgent?' urg':'')+'" data-i="'+it.id+'" style="--c:'+s.color+'"><small>'+esc(s.name)+'</small><strong>'+esc(it.name||'Без названия')+'</strong><small>'+chk+(it.time||'')+(it.dur?' · '+it.dur+' мин':'')+'</small></div>'});
  h+='</div>'}
 $('cal').innerHTML=h+'</div>';
}
$('cal').onclick=e=>{const c=e.target.closest('[data-i]');if(c){openItem(c.dataset.i);e.stopPropagation();return}const d=e.target.closest('[data-d]');if(d)openItem(null,d.dataset.d)};
function fillSubs(){const kk=$('type').value==='lesson'?'lesson':'task';$('sl').textContent=kk==='lesson'?'Предмет':'Категория';$('subj').innerHTML='<option value="">— без —</option>'+S.subjects.filter(s=>s.kind===kk).map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')}
function openItem(id,date){
 editId=id;const it=id&&S.items.find(i=>i.id===id);$('type').value=it?it.type:tab;fillSubs();
 $('dh').textContent=it?'Редактировать':'Новая запись';
 $('type').value=it?it.type:tab;$('subj').value=it?it.subject:'';$('name').value=it?it.name:'';
 $('date').value=it?it.date:(date||iso(new Date()));$('time').value=it?it.time:'';$('dur').value=it?it.dur||'':'';$('rep').value=1;
 $('fav').checked=!!(it&&it.fav);$('urg').checked=!!(it&&it.urgent);$('repw').style.display=it?'none':'';$('del').style.display=$('dn').style.display=it?'':'none';
 if(it)$('dn').textContent=it.done?'Снять отметку':'Выполнено';
 $('dlg').showModal();
}
$('cx').onclick=()=>$('dlg').close();$('type').onchange=fillSubs;
$('sv').onclick=()=>{
 const date=$('date').value;if(!date){alert('Укажите дату');return}
 const base={type:$('type').value,subject:$('subj').value,name:$('name').value.trim(),time:$('time').value,dur:+$('dur').value||0,fav:$('fav').checked,urgent:$('urg').checked};
 if(editId){Object.assign(S.items.find(i=>i.id===editId),base,{date})}
 else{const r=Math.max(1,Math.min(52,+$('rep').value||1));const d=new Date(date+'T00:00');for(let k=0;k<r;k++){S.items.push({id:uid(),...base,date:iso(d),done:false});d.setDate(d.getDate()+7)}}
 save();$('dlg').close();render();
};
$('del').onclick=()=>{S.items=S.items.filter(i=>i.id!==editId);save();$('dlg').close();render()};
$('dn').onclick=()=>{const it=S.items.find(i=>i.id===editId);it.done=!it.done;save();$('dlg').close();render()};
function subList(){$('sh').textContent=tab==='lesson'?'Предметы':'Категории дел';$('sl2').textContent=tab==='lesson'?'Новый предмет':'Новая категория';$('slist').innerHTML=S.subjects.filter(s=>s.kind===k()).map(s=>'<div class="sub" style="--c:'+s.color+'"><span class="dot"></span><span style="flex:1">'+esc(s.name)+'</span><button class="danger" data-x="'+s.id+'">'+(armed===s.id?'Точно удалить?':'Удалить')+'</button></div>').join('')||'<div class="empty">Пока пусто</div>'}
$('subs').onclick=()=>{subList();$('sdlg').showModal()};$('add').onclick=()=>openItem(null);
$('sx').onclick=()=>{armed=null;$('sdlg').close()};
$('sa').onclick=()=>{const n=$('sn').value.trim();if(!n)return;S.subjects.push({id:uid(),name:n,color:$('sc').value,kind:k()});$('sn').value='';save();subList();render()};
$('slist').onclick=e=>{const x=e.target.dataset.x;if(!x)return;if(armed!==x){armed=x;subList();return}armed=null;S.subjects=S.subjects.filter(s=>s.id!==x);S.items.forEach(i=>{if(i.subject===x)i.subject=''});save();subList();render()};
$('vseg').onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;render()}};
$('tseg').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
$('fseg').onclick=e=>{if(e.target.dataset.f){fil=e.target.dataset.f;render()}};
$('today').onclick=()=>{cur=new Date();render()};
const shift=k=>{if(view==='month')cur=new Date(cur.getFullYear(),cur.getMonth()+k,1);else{cur=new Date(cur);cur.setDate(cur.getDate()+7*k)}render()};
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);
render();
</script></body></html>
